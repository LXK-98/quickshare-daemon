[package]
name = "quickshare-daemon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Headless Quick Share (Nearby Share) daemon for Linux"
# Minimum for edition 2024.
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
# For the notification signal streams; zbus returns them as `Stream`s.
futures-util = { version = "0.3", default-features = false }

# The Quick Share protocol implementation. No stable API and marked
# `experimental` upstream, so the revision is pinned deliberately; see
# docs/DECISIONS.md#d-001. `default-features = false` + `experimental` is what
# Packet uses (upstream's default feature set is exactly `["experimental"]`,
# spelled out here so a change upstream cannot silently alter our build).
#
# Our own fork, branched at nozwock's `17702ed` -- the rev Packet is tested
# against -- carrying three fixes upstream still ships broken: the P-256
# coordinate padding (docs/DECISIONS.md#d-012), the Disconnection frame being
# sent after Finished is announced rather than before (D-014), and a peer's
# post-transfer hangup being logged at ERROR.
rqs_lib = { git = "https://github.com/LXK-98/rquickshare.git", rev = "b6699184da7b867f24c688d0a5239a62ea6d2a50", default-features = false, features = [
    "experimental",
] }

# No "rt-multi-thread": we build a current_thread runtime. rqs_lib enables that
# feature itself, so it is compiled in regardless, but we never construct one.
tokio = { version = "1.45", features = [
    "macros",
    "rt",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
    # For spawning xdg-open from the notification's "Open" button.
    "process",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
# Default features include `tracing-log`, which is what routes rqs_lib's `log`
# records into our subscriber. Do not disable it; see docs/RQS_LIB_NOTES.md.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `default-features = false` matters here: zbus defaults to the async-io
# reactor, which would run a second event loop alongside tokio's. The `tokio`
# feature makes it use ours instead. See docs/DECISIONS.md#d-006.
zbus = { version = "5.7", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
