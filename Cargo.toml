[package]
name = "quickshare-daemon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Headless Quick Share (Nearby Share) daemon for Linux"
# Minimum for edition 2024.
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
dirs = "6.0"

# The Quick Share protocol implementation. No stable API and marked
# `experimental` upstream, so the revision is pinned deliberately; see
# docs/DECISIONS.md#d-001. `default-features = false` + `experimental` is what
# Packet uses (upstream's default feature set is exactly `["experimental"]`,
# spelled out here so a change upstream cannot silently alter our build).
rqs_lib = { git = "https://github.com/nozwock/rquickshare.git", rev = "17702edc9f8b0d1e67c50f125e03ca3f8c291f3c", default-features = false, features = [
    "experimental",
] }

# No "rt-multi-thread": we build a current_thread runtime. rqs_lib enables that
# feature itself, so it is compiled in regardless, but we never construct one.
tokio = { version = "1.45", features = [
    "macros",
    "rt",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
] }
tracing = "0.1"
# Default features include `tracing-log`, which is what routes rqs_lib's `log`
# records into our subscriber. Do not disable it; see docs/RQS_LIB_NOTES.md.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
