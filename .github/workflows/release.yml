# Builds a release binary and publishes it with a checksum.
#
# Built on Ubuntu 22.04 rather than the newest runner on purpose: the binary
# links glibc, and building on a newer base raises the minimum version it runs
# against. 22.04 gives glibc 2.35, which covers most current distributions;
# building on 24.04 would require 2.39 and silently exclude older ones.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # protoc: rqs_lib generates the Nearby protobufs at build time and
          #   prost-build bundles no compiler.
          # libdbus-1-dev: bluer links libdbus.
          sudo apt-get install -y protobuf-compiler libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Report the footprint
        # The project's justification is a size and memory number, so a release
        # that quietly doubled either should be visible in the log.
        run: |
          ls -l target/release/quickshare-daemon
          printf 'minimum glibc: %s\n' \
            "$(objdump -T target/release/quickshare-daemon |
               grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)"

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          name="quickshare-daemon-$tag-x86_64-linux"
          mkdir -p "$name"
          cp target/release/quickshare-daemon "$name/"
          cp data/quickshare-daemon.service "$name/"
          cp data/quickshare_nautilus.py "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          # Plain `sha256sum -c` in the install script expects this format.
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quickshare-daemon-*-x86_64-linux.tar.gz
            quickshare-daemon-*-x86_64-linux.tar.gz.sha256
            packaging/install.sh
          body: |
            Install or update on any Linux x86_64:

            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh
            less install.sh   # read it first
            sh install.sh
            ```

            On Fedora, prefer the COPR repository instead — `dnf upgrade` then
            keeps it current.
